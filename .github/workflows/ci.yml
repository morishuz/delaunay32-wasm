name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run example:build
      - run: npm run example:file
      - run: git diff --exit-code -- index.html
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run pack:check
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: delaunay32-package
          path: |
            dist/
            package.json
            README.md
            LICENSE
            THIRD_PARTY.md
